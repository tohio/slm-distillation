[project]
name = "slm-distillation"
version = "0.1.0"
description = "Teacher-student distillation workflows for SLM checkpoints"
requires-python = ">=3.12"

dependencies = [
    "accelerate>=1.4.0",
    "boto3>=1.34.0",
    "datasets>=4.7.0",
    "huggingface_hub>=0.24.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "torch>=2.4.0",
    "transformers>=4.56.2,<6",
    "trl>=1.8.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
