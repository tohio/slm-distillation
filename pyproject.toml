[project]
name = "slm-distillation"
version = "0.1.0"
description = "Teacher-student distillation workflows for SLM checkpoints"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.34.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.24.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
