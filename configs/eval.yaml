models:
  - name: base
    model_name_or_path: HuggingFaceTB/SmolLM2-135M-Instruct
    tokenizer_name_or_path: HuggingFaceTB/SmolLM2-135M-Instruct
    revision: main
  - name: response_distilled
    model_name_or_path: runs/smollm2-135m-response-distilled/response_distill/checkpoints/final
    tokenizer_name_or_path: runs/smollm2-135m-response-distilled/response_distill/checkpoints/final
    revision: null
  - name: response_dpo
    model_name_or_path: runs/smollm2-135m-response-distilled/dpo/checkpoints/final
    tokenizer_name_or_path: runs/smollm2-135m-response-distilled/dpo/checkpoints/final
    revision: null

data:
  dataset_id: tohio/slm-synthetic-distillation-sft
  dataset_config_name: null
  dataset_split: train
  id_field: id
  prompt_field: prompt
  reference_field: response

preference_data:
  dataset_id: tohio/slm-synthetic-distillation-dpo
  dataset_config_name: null
  dataset_split: train
  id_field: id
  prompt_field: prompt
  chosen_field: chosen
  rejected_field: rejected

formatting:
  mode: chat
  system_prompt: null

generation:
  max_input_length: 1024
  max_new_tokens: 256
  per_device_batch_size: 8
  do_sample: false
  temperature: 0.0
  seed: 42
  limit: 200

output:
  results_path: runs/smollm2-135m-response-distilled/eval/results.json
  predictions_dir: runs/smollm2-135m-response-distilled/eval/predictions
