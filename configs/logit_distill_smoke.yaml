teacher:
  provider: local
  model_name: smollm2-1.7b-instruct
  checkpoint_path: HuggingFaceTB/SmolLM2-1.7B-Instruct
  tokenizer_path: HuggingFaceTB/SmolLM2-1.7B-Instruct
  revision: main

student:
  model_name: smollm2-135m-instruct
  checkpoint_path: HuggingFaceTB/SmolLM2-135M-Instruct
  tokenizer_path: HuggingFaceTB/SmolLM2-135M-Instruct
  revision: main

data:
  dataset_id: tohio/slm-synthetic-distillation-sft
  dataset_config_name: null
  dataset_split: train
  id_field: id
  prompt_field: prompt
  response_field: response
  metadata_field: metadata

formatting:
  mode: chat
  system_prompt: null

distillation:
  mode: logit
  temperature: 2.0
  alpha: 0.5
  max_length: 1024
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 0.000005
  num_train_epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  logging_steps: 1
  save_steps: 5
  save_total_limit: 1
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  seed: 42
  max_steps: 5
  max_train_samples: 64

compatibility:
  require_same_tokenizer: true

hardware:
  single_gpu_required: true
  allowed_gpu_classes:
    - b300
    - b200
    - h200
    - a100

output:
  run_dir: runs/smoke/smollm2-135m-logit-distilled/logit_distill
  checkpoint_dir: runs/smoke/smollm2-135m-logit-distilled/logit_distill/checkpoints
  final_checkpoint_dir: runs/smoke/smollm2-135m-logit-distilled/logit_distill/checkpoints/final
