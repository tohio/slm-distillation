
source:
  model_name: smollm2-135m-deepseek-distilled
  checkpoint_path: runs/smollm2-135m-deepseek-distilled/response_distill/checkpoints/final
  tokenizer_path: HuggingFaceTB/SmolLM2-135M-Instruct

data:
  dataset_id: tohio/slm-synthetic-distillation-dpo
  dataset_split: train

training:
  method: dpo
  beta: 0.1
  max_length: 1024
  max_prompt_length: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.000005
  num_train_epochs: 1
  warmup_ratio: 0.03
  bf16: true
  seed: 42

output:
  model_name: smollm2-135m-deepseek-distilled
  run_dir: runs/smollm2-135m-deepseek-distilled/dpo
  checkpoint_dir: runs/smollm2-135m-deepseek-distilled/dpo/checkpoints
  final_checkpoint_dir: runs/smollm2-135m-deepseek-distilled/dpo/checkpoints/final
